[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-workbench"
version = "0.1.0"
description = "Interactive, notebook-free dashboard for the full machine learning lifecycle"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib==1.6.0",
    "numpy==2.5.3",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "plotly==7.1.0",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
    "streamlit==1.65.0",
]

[project.optional-dependencies]
boost = ["catboost>=1.2", "lightgbm>=4.4", "xgboost>=2.1"]
explain = ["shap>=0.46"]
tuning = ["optuna>=4.0"]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-PyYAML==6.0.12.20260906",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src/ml_workbench"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
